[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignlab"
version = "0.1.0"
description = "An end-to-end LLM post-training framework built from first principles (SFT, LoRA/QLoRA, DPO, evaluation)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

# --------------------------------------------------------------------------
# requires-python is deliberately ">=3.10", NOT ">=3.11".
#
# Reason: AlignLab runs on two machines - a local Windows development box and
# a department Linux server. The server's Python version has NOT been verified
# (see docs and scripts/server_probe.sh). Ubuntu 22.04's system Python is
# 3.10, so pinning to >=3.11 could lock us out of the primary training
# environment. The local venv uses 3.11, which is compatible with code
# targeting 3.10.
#
# ACTION REQUIRED once the server is probed: confirm the server Python version
# and, if it differs, re-evaluate this floor. Do not raise it without evidence.
# --------------------------------------------------------------------------

dependencies = [
    "torch>=2.0",           # CPU build locally; CUDA build on the server.
    "hydra-core>=1.3",      # configuration composition
    "omegaconf>=2.3",       # backing config object model
    "numpy>=1.24",
    "rich>=13.0",           # console logging
]

[project.optional-dependencies]
# Experiment tracking. Kept optional so the foundation is testable with no
# account and no network (the "noop" and "offline" trackers cover that).
tracking = ["wandb>=0.16"]

# Phases 3+ (SFT / PEFT / DPO). NOT installed during Phase 1 - the foundation
# deliberately does not depend on the modelling stack.
train = [
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.29",
    "peft>=0.10",
    "trl>=0.8",
]

# Server-only. bitsandbytes has no useful CPU path and its availability on the
# server is UNVERIFIED. flash-attn requires Ampere+ and a CUDA toolchain.
quant = ["bitsandbytes>=0.43"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: test takes more than a few seconds",
    "gpu: requires a working CUDA device (skipped on CPU-only machines)",
    "network: requires outbound internet access",
    "server: requires the department server (NEVER runs locally)",
]
