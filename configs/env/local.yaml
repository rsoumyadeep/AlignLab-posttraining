# Local development machine.
#
# VERIFIED 2026-08-29 on this machine:
#   - torch 2.12.1+cpu, torch.cuda.is_available() == False
#   - GPU present (GTX 1050, 4 GB, compute capability 6.1) but UNUSABLE by the
#     installed CPU-only torch build
#   - signal.SIGUSR1 does not exist on this platform
#
# Role: authoring, documentation, fast CPU tests, conceptual experiments.
# NOT a training environment - 4 GB VRAM cannot hold Qwen2.5-1.5B for training
# under any configuration.

name: local

# Empty -> alignlab.paths falls back to the ALIGNLAB_* environment variables,
# and then to repository-relative defaults. That is correct here because this
# machine is not shared and the repo lives on a disk with 367 GB free.
output_root: ""
checkpoint_root: ""
cache_root: ""

device: cpu
num_workers: 0
expect_cuda: false
