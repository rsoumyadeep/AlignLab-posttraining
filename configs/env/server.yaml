# Department GPU server - PRIMARY TRAINING ENVIRONMENT.
#
# csrslave. Every value below was VERIFIED ON THE LIVE SERVER on 2026-08-29.
# The evidence is committed verbatim in:
#   docs/phase1/server_probe_output_2026-08-29.txt
#   docs/phase1/server_probe_supplementary_2026-08-29.txt
#
# This file previously held Hydra MISSING (???) for every path so that it could
# not be used before the machine was actually probed. Those placeholders are now
# replaced with observed values, each justified below.
#
# ---------------------------------------------------------------------------
# VERIFIED HARDWARE (torch 2.6.0+cu124, measured from Python - not inferred)
#   2 x NVIDIA RTX A6000, 47.53 GiB usable each, compute capability 8.6
#   torch.cuda.is_available()   -> True
#   torch.cuda.device_count()   -> 2
#   torch.cuda.is_bf16_supported() -> True   (a bf16 matmul was executed)
#   CUDA 12.4, cuDNN 9.1.0, driver 550.144.03
#   AMD EPYC 7513, 64 threads; 503 GiB RAM
#   GPU0<->GPU1 topology "SYS" - PCIe/SMP, NO NVLink
#
# VERIFIED INFRASTRUCTURE
#   SLURM is INSTALLED (22.05.9) but NON-FUNCTIONAL:
#     scontrol ping -> "Slurmctld(primary) at csrmaster is DOWN"
#     slurmctld and slurmd services -> failed
#   Jobs must therefore run directly under tmux. Nothing reserves a GPU;
#   8 other users share this machine. Check nvidia-smi before every launch.
#
# ---------------------------------------------------------------------------
# STORAGE - THE BINDING CONSTRAINT
#   /data is 99% full. Evidence: "df -h /data" -> 7.3T size, 82G available
#   at probe time. Home (/data/home/rsoumyadeep) is on that SAME ext4 volume.
#   /data/data2 is writable but is the same filesystem, so it adds no space.
#   / is NOT writable by this user; /tmp is writable and sits on a separate
#   1.6 TB NVMe, but is volatile and unsuitable for durable artifacts.
#
#   CONSEQUENCE: keep_last_checkpoints must stay small, and the HF cache must
#   be watched. A 1.5B model is ~3.1 GB in bf16; that fits, but there is no
#   room for careless accumulation.
# ---------------------------------------------------------------------------

name: server

# Run outputs: logs, resolved configs, manifests, metrics. Small (KB-MB).
# Evidence: repository cloned and verified at this path; parent is writable
# ("/data/home/rsoumyadeep  EXISTS, WRITABLE" in the probe output).
output_root: /data/home/rsoumyadeep/AlignLab/outputs

# Model checkpoints. LARGE. Same volume as everything else - there is no
# separate large scratch volume on this machine, which is exactly why
# rotation matters here.
checkpoint_root: /data/home/rsoumyadeep/AlignLab/checkpoints

# Hugging Face model/dataset cache. LARGE.
# Deliberately NOT the default ~/.cache/huggingface: ~/.cache is ALREADY 24 GB
# on this 82-GB-free volume. Keeping the AlignLab cache under the project makes
# its size visible and separately prunable.
cache_root: /data/home/rsoumyadeep/AlignLab/.cache/huggingface

# Resolves to cuda:0. VERIFIED: torch.cuda.is_available() is True.
device: auto

# Evidence: nproc -> 64. But the machine is SHARED with 8 active users, so a
# polite fraction is used rather than the full count. Raise only after checking
# who else is running.
num_workers: 4

expect_cuda: true
